<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    background: #1a1a2e;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
  }
  #gameContainer { position: relative; }
  canvas {
    border: 4px solid #444;
    border-radius: 8px;
    background: #7ec8e3;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    text-shadow: 1px 1px 2px black;
    pointer-events: none;
    font-size: 16px;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    text-shadow: 2px 2px 4px black;
    display: none;
  }
  #message h1 { font-size: 36px; margin: 0 0 10px; }
  #message p { margin: 4px; font-size: 15px; }
  #controls {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: #ccc;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hud">
    <div id="livesDisplay">❤️ x3</div>
    <div id="levelDisplay">Level 1</div>
    <div id="scoreDisplay">Score: 0</div>
  </div>
  <div id="message">
    <h1 id="msgTitle"></h1>
    <p id="msgSub"></p>
    <p>Press R to restart</p>
  </div>
  <canvas id="game" width="800" height="450"></canvas>
</div>
<div id="controls">
  Arrow keys / A-D to move · Space or W to jump · Stomp enemies from above to defeat them · Collect all coins to finish the level
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRAVITY = 0.6;

let keys = {};
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (gameState !== 'playing' && e.key.toLowerCase() === 'r') restartGame();
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---------- Level definitions ----------
// platforms: x, y, w, h
// coins: x, y
// enemies: x, y, range (patrol distance), speed
// spikes: x, y, w, h (instant damage)
function buildLevels() {
  return [
    {
      name: "Level 1",
      playerStart: { x: 40, y: 350 },
      goal: { x: 740, y: 300, w: 40, h: 60 },
      platforms: [
        { x: 0, y: 410, w: 800, h: 40 },
        { x: 250, y: 330, w: 120, h: 20 },
        { x: 430, y: 270, w: 120, h: 20 },
        { x: 600, y: 350, w: 150, h: 20 }
      ],
      coins: [
        { x: 150, y: 370 }, { x: 300, y: 290 }, { x: 470, y: 230 },
        { x: 640, y: 310 }, { x: 700, y: 310 }
      ],
      enemies: [
        { x: 300, y: 410, range: 100, speed: 1.5, dir: 1 },
        { x: 620, y: 410, range: 80, speed: 1.8, dir: -1 }
      ],
      spikes: [
        { x: 380, y: 400, w: 40, h: 10 }
      ]
    },
    {
      name: "Level 2",
      playerStart: { x: 40, y: 350 },
      goal: { x: 740, y: 90, w: 40, h: 60 },
      platforms: [
        { x: 0, y: 410, w: 200, h: 40 },
        { x: 250, y: 380, w: 100, h: 20 },
        { x: 400, y: 330, w: 100, h: 20 },
        { x: 550, y: 280, w: 100, h: 20 },
        { x: 400, y: 200, w: 100, h: 20 },
        { x: 600, y: 150, w: 200, h: 20 }
      ],
      coins: [
        { x: 290, y: 340 }, { x: 440, y: 290 }, { x: 590, y: 240 },
        { x: 440, y: 160 }, { x: 650, y: 110 }, { x: 720, y: 110 }
      ],
      enemies: [
        { x: 100, y: 410, range: 90, speed: 2, dir: 1 },
        { x: 420, y: 330, range: 60, speed: 2.2, dir: 1 },
        { x: 630, y: 150, range: 130, speed: 2.5, dir: -1 }
      ],
      spikes: [
        { x: 200, y: 400, w: 50, h: 10 },
        { x: 500, y: 400, w: 50, h: 10 }
      ]
    },
    {
      name: "Level 3 — Final",
      playerStart: { x: 40, y: 350 },
      goal: { x: 740, y: 50, w: 40, h: 60 },
      platforms: [
        { x: 0, y: 410, w: 150, h: 40 },
        { x: 200, y: 410, w: 100, h: 40 },
        { x: 350, y: 360, w: 90, h: 20 },
        { x: 500, y: 320, w: 90, h: 20 },
        { x: 350, y: 260, w: 90, h: 20 },
        { x: 200, y: 200, w: 90, h: 20 },
        { x: 350, y: 140, w: 90, h: 20 },
        { x: 550, y: 110, w: 250, h: 20 }
      ],
      coins: [
        { x: 240, y: 370 }, { x: 380, y: 320 }, { x: 530, y: 280 },
        { x: 380, y: 220 }, { x: 240, y: 160 }, { x: 380, y: 100 },
        { x: 650, y: 70 }, { x: 730, y: 70 }
      ],
      enemies: [
        { x: 220, y: 410, range: 60, speed: 2, dir: 1 },
        { x: 370, y: 360, range: 40, speed: 2.5, dir: 1 },
        { x: 220, y: 200, range: 60, speed: 2.8, dir: 1 },
        { x: 600, y: 110, range: 160, speed: 3, dir: 1 }
      ],
      spikes: [
        { x: 150, y: 400, w: 50, h: 10 },
        { x: 300, y: 400, w: 50, h: 10 }
      ]
    }
  ];
}

let levels = buildLevels();
let levelIndex = 0;
let score = 0;
let lives = 3;
let gameState = 'playing'; // playing, won, lost, gameover
let invulnTimer = 0;

let player, platforms, coins, enemies, spikes, goal;

function loadLevel(idx) {
  const lvl = levels[idx];
  player = {
    x: lvl.playerStart.x, y: lvl.playerStart.y,
    vx: 0, vy: 0, width: 28, height: 36,
    onGround: false, facing: 1
  };
  platforms = lvl.platforms.map(p => ({ ...p }));
  coins = lvl.coins.map(c => ({ ...c, collected: false, bob: Math.random() * Math.PI * 2 }));
  enemies = lvl.enemies.map(e => ({ ...e, startX: e.x, alive: true }));
  spikes = lvl.spikes.map(s => ({ ...s }));
  goal = { ...lvl.goal };
  document.getElementById('levelDisplay').textContent = lvl.name;
}

function restartGame() {
  levelIndex = 0;
  score = 0;
  lives = 3;
  gameState = 'playing';
  invulnTimer = 0;
  loadLevel(0);
  document.getElementById('message').style.display = 'none';
  updateHud();
}

function updateHud() {
  document.getElementById('livesDisplay').textContent = '❤️ x' + lives;
  document.getElementById('scoreDisplay').textContent = 'Score: ' + score;
}

function rectOverlap(a, b) {
  return a.x < b.x + b.w && a.x + (a.width||a.w) > b.x &&
         a.y < b.y + b.h && a.y + (a.height||a.h) > b.y;
}

function damagePlayer() {
  if (invulnTimer > 0) return;
  lives--;
  invulnTimer = 90;
  updateHud();
  if (lives <= 0) {
    gameState = 'lost';
    showMessage('Game Over', `Final Score: ${score}`);
  } else {
    // knockback reset position a bit
    player.x = Math.max(20, player.x - 60);
    player.vy = -8;
  }
}

function showMessage(title, sub) {
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgSub').textContent = sub;
  document.getElementById('message').style.display = 'block';
}

function update() {
  if (gameState !== 'playing') return;

  if (invulnTimer > 0) invulnTimer--;

  // input
  const speed = 4;
  if (keys['arrowleft'] || keys['a']) { player.vx = -speed; player.facing = -1; }
  else if (keys['arrowright'] || keys['d']) { player.vx = speed; player.facing = 1; }
  else { player.vx *= 0.8; }

  if ((keys['arrowup'] || keys['w'] || keys[' ']) && player.onGround) {
    player.vy = -13;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  player.x = Math.max(0, Math.min(W - player.width, player.x));

  // platform collision (simple top-only landing + side blocking)
  player.onGround = false;
  platforms.forEach(p => {
    const pRect = { x: p.x, y: p.y, w: p.w, h: p.h };
    const feet = { x: player.x, y: player.y - player.height, width: player.width, height: player.height };
    if (rectOverlap(feet, pRect)) {
      const prevFeetY = feet.y - player.vy;
      if (player.vy >= 0 && prevFeetY + player.height <= p.y + 1) {
        player.y = p.y;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0 && prevFeetY >= p.y + p.h - 1) {
        player.y = p.y + p.h + player.height;
        player.vy = 0;
      } else {
        if (player.vx > 0) player.x = p.x - player.width;
        else if (player.vx < 0) player.x = p.x + p.w;
      }
    }
  });

  if (player.y > H + 100) {
    damagePlayer();
    player.x = levels[levelIndex].playerStart.x;
    player.y = levels[levelIndex].playerStart.y;
    player.vy = 0;
  }

  // spikes
  spikes.forEach(s => {
    const rect = { x: player.x, y: player.y - player.height, width: player.width, height: player.height };
    if (rectOverlap(rect, { x: s.x, y: s.y, w: s.w, h: s.h })) {
      damagePlayer();
    }
  });

  // enemy AI: patrol back and forth, turn at range limit or platform edge
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.speed * e.dir;
    if (Math.abs(e.x - e.startX) > e.range) e.dir *= -1;

    const eRect = { x: e.x, y: e.y - 24, w: 24, h: 24 };
    const pRect = { x: player.x, y: player.y - player.height, width: player.width, height: player.height };
    if (rectOverlap(pRect, eRect)) {
      const playerBottom = player.y;
      const enemyTop = e.y - 24;
      if (player.vy > 0 && playerBottom - player.vy <= enemyTop + 10) {
        // stomp
        e.alive = false;
        player.vy = -9;
        score += 50;
        updateHud();
      } else {
        damagePlayer();
      }
    }
  });

  // coins
  coins.forEach(c => {
    if (c.collected) return;
    const dx = (player.x + player.width/2) - c.x;
    const dy = (player.y - player.height/2) - c.y;
    if (Math.sqrt(dx*dx + dy*dy) < 24) {
      c.collected = true;
      score += 10;
      updateHud();
    }
  });

  // goal
  const pRect = { x: player.x, y: player.y - player.height, width: player.width, height: player.height };
  const allCoinsCollected = coins.every(c => c.collected);
  if (rectOverlap(pRect, { x: goal.x, y: goal.y, w: goal.w, h: goal.h })) {
    if (allCoinsCollected) {
      if (levelIndex < levels.length - 1) {
        levelIndex++;
        score += 100;
        loadLevel(levelIndex);
        updateHud();
      } else {
        gameState = 'won';
        score += 200;
        updateHud();
        showMessage('You Win!', `All levels cleared — Final Score: ${score}`);
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // sky gradient background handled by canvas bg color; add clouds
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 3; i++) {
    const cx = (i * 300 + (performance.now()/50) % 900) % 900 - 50;
    ctx.beginPath();
    ctx.ellipse(cx, 60 + i*30, 30, 15, 0, 0, Math.PI*2);
    ctx.ellipse(cx+25, 55 + i*30, 22, 12, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // platforms
  platforms.forEach(p => {
    ctx.fillStyle = '#5a3921';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(p.x, p.y, p.w, 6);
  });

  // spikes
  spikes.forEach(s => {
    ctx.fillStyle = '#888';
    const count = Math.floor(s.w / 10);
    for (let i = 0; i < count; i++) {
      ctx.beginPath();
      ctx.moveTo(s.x + i*10, s.y + s.h);
      ctx.lineTo(s.x + i*10 + 5, s.y);
      ctx.lineTo(s.x + i*10 + 10, s.y + s.h);
      ctx.closePath();
      ctx.fill();
    }
  });

  // coins
  coins.forEach(c => {
    if (c.collected) return;
    const bobY = c.y + Math.sin(performance.now()/200 + c.bob) * 4;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(c.x, bobY, 9, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // goal flag
  ctx.fillStyle = '#333';
  ctx.fillRect(goal.x + goal.w/2 - 3, goal.y, 6, goal.h);
  ctx.fillStyle = coins.every(c => c.collected) ? '#2ecc71' : '#999';
  ctx.beginPath();
  ctx.moveTo(goal.x + goal.w/2 + 3, goal.y);
  ctx.lineTo(goal.x + goal.w/2 + 30, goal.y + 12);
  ctx.lineTo(goal.x + goal.w/2 + 3, goal.y + 24);
  ctx.closePath();
  ctx.fill();

  // enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath();
    ctx.arc(e.x + 12, e.y - 12, 12, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(e.x + 8 + e.dir*3, e.y - 14, 3, 0, Math.PI*2);
    ctx.arc(e.x + 16 + e.dir*3, e.y - 14, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(e.x + 8 + e.dir*4, e.y - 14, 1.5, 0, Math.PI*2);
    ctx.arc(e.x + 16 + e.dir*4, e.y - 14, 1.5, 0, Math.PI*2);
    ctx.fill();
  });

  // player
  if (invulnTimer === 0 || invulnTimer % 6 < 3) {
    ctx.fillStyle = '#e63946';
    ctx.fillRect(player.x, player.y - player.height, player.width, player.height);
    // face
    ctx.fillStyle = '#ffd8a8';
    ctx.fillRect(player.x + (player.facing === 1 ? player.width - 10 : 2), player.y - player.height + 4, 10, 10);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0);
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
