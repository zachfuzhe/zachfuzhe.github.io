<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Class Dismissed!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:#1a1408; font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif; overflow:hidden; touch-action:none; user-select:none; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100%; width:100%; }
  #stage { position:relative; width:min(100%, 900px, calc((100vh - 16px) * 1.8)); aspect-ratio:900/500; }
  #game { width:100%; height:100%; display:block; background:#ffe29a; border:3px solid #2a1f10; image-rendering:pixelated; cursor:crosshair; }
  #weaponBar { position:absolute; bottom:8px; left:10px; display:none; gap:8px; pointer-events:auto; }
  #stage[data-state="playing"] #weaponBar { display:flex; }
  .weapon-slot { width:54px; height:54px; background:rgba(20,12,6,0.85); border:3px solid #1e1410; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; }
  .weapon-slot.active { border-color:#ffd166; box-shadow:0 0 0 2px rgba(255,209,102,0.55), 0 0 12px rgba(255,209,102,0.5); }
  .weapon-slot.empty { opacity:0.35; }
  .weapon-slot canvas { width:36px; height:36px; image-rendering:pixelated; background:transparent; border:none; }
  .weapon-count { position:absolute; bottom:1px; right:3px; color:#fff3d6; font-size:11px; font-weight:bold; text-shadow:1px 1px 1px #000; }
  .weapon-key { position:absolute; top:1px; left:3px; color:#c9a66b; font-size:9px; font-weight:bold; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,8,4,0.88); color:#fff3d6; text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  #overlay.info { background:rgba(14,9,5,0.97); }
  #overlay.info #panel { width:94%; max-width:840px; }
  #overlay.menu { background:none; align-items:flex-end; justify-content:center; padding:0 0 14px 0; pointer-events:none; }
  #overlay.menu #panel { background:none; border:none; padding:0; }
  #overlay.menu #overlayTitle, #overlay.menu #overlayText { display:none; }
  #overlay.result { background:none; align-items:flex-end; justify-content:flex-end; padding:0 12px 10px 0; pointer-events:none; }
  #overlay.result #panel { background:rgba(20,12,6,0.92); border:3px solid #1e1410; border-radius:8px; padding:6px 12px 8px; max-width:330px; }
  #overlay.result #panel button { margin:6px 4px 0; padding:8px 10px; font-size:10px; }
  #overlay.result #overlayTitle { font-size:clamp(11px,1.8vw,15px); margin:0 0 4px; }
  #overlay.result #overlayText { font-size:clamp(10px,1.6vw,13px); }
  #panel { pointer-events:auto; max-width:94%; max-height:96%; overflow:auto; }
  #overlayTitle { font-family:'Press Start 2P','Trebuchet MS',monospace; font-size:clamp(14px,2.6vw,22px); margin:0 0 10px; color:#ffd166; line-height:1.4; }
  #overlayText { font-size:clamp(11px,1.8vw,14px); margin:3px auto; max-width:560px; line-height:1.45; }
  #panel button { margin:10px 5px 0; background:#ffd166; color:#2a1f10; border:3px solid #1e1410; box-shadow:4px 4px 0 rgba(0,0,0,0.45); font-family:'Press Start 2P','Trebuchet MS',monospace; font-weight:800; font-size:clamp(9px,1.5vw,12px); padding:10px 14px; cursor:pointer; }
  #panel button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,0.45); }
  #panel button.alt { background:#4ecdc4; }
  #highScoreLine { font-size:11px; color:#a8ebe5; margin-top:4px; }
  .howto { text-align:left; font-size:clamp(9px,1.35vw,12px); line-height:1.38; display:grid; grid-template-columns:1fr 1fr; gap:4px 22px; }
  .howto h3 { margin:8px 0 3px; color:#ffd166; font-size:clamp(11px,1.7vw,14px); }
  .howto .row { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
  .howto .vis { text-align:center; font-size:10px; width:74px; }
  .howto .vis img { height:56px; image-rendering:pixelated; display:block; margin:0 auto 2px; }
  .howto .ok { color:#7CFC8A; font-weight:bold; }
  .howto .no { color:#ff7b7b; font-weight:bold; }
  #sfxBtn { position:absolute; top:42px; right:8px; background:rgba(20,12,6,0.7); color:#fff3d6; border:2px solid #1e1410; border-radius:4px; font-size:10px; padding:3px 6px; cursor:pointer; z-index:5; }
  #rotatePrompt { display:none; position:fixed; inset:0; background:#1a1408; color:#fff3d6; z-index:999; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-size:18px; }
  @media screen and (max-aspect-ratio:1/1) and (max-width:700px) { #wrap { display:none; } #rotatePrompt { display:flex; } }
</style>
</head>
<body>
<div id="rotatePrompt"><div style="font-size:42px;margin-bottom:14px;">&#128241;</div><div><b>Rotate your phone to landscape</b><br>Class Dismissed! plays best sideways.</div></div>
<div id="wrap">
  <div id="stage" data-state="ready">
    <canvas id="game" width="900" height="500"></canvas>
    <div id="weaponBar"></div>
    <button id="sfxBtn">SFX: ON</button>
    <div id="overlay" class="menu">
      <div id="panel">
        <h1 id="overlayTitle">Class Dismissed!</h1>
        <div id="overlayText"></div>
        <div id="highScoreLine"></div>
        <div id="modeBtns"></div>
      </div>
    </div>
  </div>
</div>

  for (var y=0;y<d.GH;y++) for (var x=0;x<d.GW;x++) if (d.rows[y].charAt(x)!==".") { if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  return bboxCache[key]={minX:minX,minY:minY,maxX:maxX,maxY:maxY};
}
var ctx, canvas;
function blit(key, x, y, cell){ ctx.drawImage(getSprite(key,cell), Math.round(x), Math.round(y)); }
function spriteCropURL(key, cell){
  var b=bboxOf(key), src=getSprite(key,cell);
  var x0=Math.round(b.minX*cell), y0=Math.round(b.minY*cell), x1=Math.round((b.maxX+1)*cell), y1=Math.round((b.maxY+1)*cell);

function txt(s,x,y,size,color,align,font,strokeW,strokeC){
  ctx.font = size+"px "+(font||FONT_PIXEL);
  ctx.textAlign = align||"left"; ctx.textBaseline = "alphabetic";
  if (strokeW) { ctx.lineWidth=strokeW; ctx.strokeStyle=strokeC||"#1e1410"; ctx.lineJoin="round"; ctx.strokeText(s,x,y); }
  ctx.fillStyle = color; ctx.fillText(s,x,y);
}
function rrPath(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function burstPath(x,y,r,spikes,rot){
  ctx.beginPath();
  for (var i=0;i<spikes*2;i++){ var a=rot+i*Math.PI/spikes, rr=(i%2===0)?r:r*0.6; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.closePath();
}
function drawBubble(text, cx, bottom, fs, pop){
  ctx.save();
  ctx.font = "bold "+fs+"px "+FONT_COMIC;
  var maxW = fs*11;
  var words = text.split(" "), lines=[], cur="";
  for (var i=0;i<words.length;i++){ var t=cur?cur+" "+words[i]:words[i]; if(ctx.measureText(t).width>maxW && cur){lines.push(cur);cur=words[i];} else cur=t; }
  lines.push(cur);
  var lh=fs*1.2, tw=0; for (var j=0;j<lines.length;j++) tw=Math.max(tw,ctx.measureText(lines[j]).width);
  var bw=tw+12, bh=lines.length*lh+7;
  var bx=clamp(cx-bw/2,3,CW-bw-3), by=bottom-7-bh;
  if (pop!==undefined && pop!==1){ ctx.translate(cx,bottom); ctx.scale(pop,pop); ctx.translate(-cx,-bottom); }
  ctx.fillStyle="#fffdf2"; ctx.strokeStyle="#1e1410"; ctx.lineWidth=2.5; ctx.lineJoin="round";
  rrPath(bx,by,bw,bh,5); ctx.fill(); ctx.stroke();
  var tx=clamp(cx,bx+9,bx+bw-9);
  ctx.beginPath(); ctx.moveTo(tx-5,by+bh-1); ctx.lineTo(cx,bottom); ctx.lineTo(tx+5,by+bh-1); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle="#fffdf2"; ctx.fillRect(tx-4,by+bh-3,8,4);
  ctx.fillStyle="#1e1410"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  for (var k=0;k<lines.length;k++) ctx.fillText(lines[k], bx+bw/2, by+fs+1+k*lh);
  ctx.restore();
  return { x0:bx, y0:by, x1:bx+bw, y1:bottom };
}
function comicBurst(x,y,text,size,t01,color){
  var pop = t01<0.2 ? 0.5+2.5*t01 : 1;
  var alpha = t01>0.7 ? (1-t01)/0.3 : 1;
  ctx.save(); ctx.globalAlpha=clamp(alpha,0,1);
  ctx.translate(x,y); ctx.scale(pop,pop); ctx.rotate(-0.12);
  var r = size*1.15;
  ctx.fillStyle="#ff3b2f"; burstPath(0,0,r*1.12,11,0.2); ctx.fill();
  ctx.fillStyle=color||"#ffe23a"; ctx.strokeStyle="#1e1410"; ctx.lineWidth=3; burstPath(0,0,r,11,0.2); ctx.fill(); ctx.stroke();
  ctx.font="900 "+size+"px "+FONT_IMPACT; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.lineWidth=5; ctx.strokeStyle="#fff"; ctx.strokeText(text,0,2); ctx.lineWidth=3; ctx.strokeStyle="#1e1410"; ctx.strokeText(text,0,2);
  ctx.fillStyle="#d1210f"; ctx.fillText(text,0,2);
  ctx.restore(); ctx.textBaseline="alphabetic";
}

var Sfx = (function(){
  var ac=null, on=true;
  function init(){ if(ac) return; try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) ac=new AC(); }catch(e){} }
  function tone(f,d,type,vol,slide,delay){
    if(!ac||!on) return;
    try{
      var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
      o.type=type||"square"; o.frequency.setValueAtTime(f,t);
      if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d);
      g.gain.setValueAtTime(vol||0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.03);
    }catch(e){}
  }
  return {
    init:init, setOn:function(v){on=v;}, isOn:function(){return on;},
    throwS:function(){ tone(500,0.08,"triangle",0.05,-250); },
    hit:function(){ tone(200,0.1,"square",0.11,-90); tone(90,0.14,"triangle",0.13,-30,0.02); },

  if (!R || state!=='playing' || R.countdown>0 || R.charge.on) return;

  R.charge={on:true,t0:R.t,idx:idx};
}
function releaseCharge(){
  if (!R || !R.charge.on) return;
  var power=clamp((R.t-R.charge.t0)/CHARGE_MS,0,1);
  var idx=R.charge.idx;
  R.charge.on=false;
  if (idx>=0) throwAt(idx, power>=0.9);
}
function throwAt(idx, charged){
  if (R.ammo[R.weapon]<=0) return;
  var w=R.weapon;
  R.ammo[w]--; R.throws++;
  R.throwT0=R.t; var gd=geom(R.desks[idx]); R.lastShot={x:R.desks[idx].x, y:gd.top+5*R.desks[idx].c};
  R.projectiles.push({ idx:idx, weapon:w, t0:R.t, charged:!!charged, resolved:false });
  Sfx.throwS();
  if (R.ammo[w]<=0) R.weapon='chalk';
}
function resolveHit(idx, weapon, charged){
  var d=R.desks[idx], g=geom(d);
  var hx=d.x, hy=g.top+4*d.c;
  if (d.state==='mis'){
    var mult=BEH[d.behavior].mult, cm=comboMult(R.combo);
    var pts=Math.round(WEAPONS[weapon].base*mult*cm*(charged?1.5:1));
    addScore(pts); R.combo++; R.hits++; if (R.combo>R.maxCombo) R.maxCombo=R.combo;
    d.state='hit'; d.t0=R.t; d.until=R.t+1300; d.innocent=false;
    d.hitLine=pick(HIT_LINES[d.occ.id]||HIT_LINES.any);
    d.cooldownUntil=R.t+3200;
    R.bursts.push({x:hx,y:hy-10,text:weapon==='eraser'?"KA-BOOM!":pick(["POW!","BONK!","THWACK!","SMACK!"]),size:weapon==='eraser'?26:20,t0:R.t,dur:520,color:'#ffe23a'});
    popText(hx,hy-34,"+"+pts,true,pts>=60);
    dust(hx,hy,10,'#fff3d6'); shake(weapon==='eraser'?7:4,weapon==='eraser'?320:200);
    Sfx.hit(); Sfx.good();
  } else if (d.state==='idle'){
    addScore(-MISS_PENALTY); R.combo=0;
    d.state='hit'; d.t0=R.t; d.until=R.t+1000; d.hitLine=pick(INNOCENT_LINES); d.cooldownUntil=R.t+2500; d.innocent=true;

  R.projectiles.push({ door:true, weapon:w, t0:R.t, resolved:true });

function endRound(){
  R.ended=true; R.t=ROUND_MS;

  if (R.mode==='level'){
    var cfg=LEVELS[R.level-1]; win = R.score>=cfg.target;
    R.stars = win ? (R.score>=cfg.target*1.7?3:(R.score>=cfg.target*1.35?2:1)) : 0;
    if (win && R.level>=TOTAL_LEVELS) state='win'; else if (win) state='levelComplete'; else state='gameOver';
  } else { state='win'; win=true; }

function update(dt){
  if (state!=='playing' || !R || frozen) return;
  if (R.countdown>0){ R.countdown-=dt; if (R.countdown>0) return; dt=-R.countdown; R.countdown=0; }
  R.t+=dt;
  if (R.t>=ROUND_MS){ endRound(); return; }
  var secLeft=Math.ceil((ROUND_MS-R.t)/1000);
  if (secLeft<=5 && secLeft!==R.lastTick){ R.lastTick=secLeft; Sfx.tick(); }
  var cfg=curCfg();

  if (R.t>=R.nextSpawn){
    if (activeCount()<cfg.maxActive) spawnMis(cfg);
    R.nextSpawn=R.t+cfg.spawnMs*(0.75+rand()*0.5);
  }
  for (var i=0;i<R.desks.length;i++){
    var d=R.desks[i];
    if (d.state==='mis' && R.t>=d.until){ d.state='idle'; d.cooldownUntil=R.t+1200; }
    else if (d.state==='hit' && R.t>=d.until){ d.state='idle'; d.innocent=false; }
  }
  for (var k=R.projectiles.length-1;k>=0;k--){
    var p=R.projectiles[k];
    if (p.door){ if (R.t-p.t0>TRAVEL_MS+100) R.projectiles.splice(k,1); continue; }
    if (!p.resolved && R.t-p.t0>=TRAVEL_MS){ p.resolved=true; resolveHit(p.idx,p.weapon,p.charged); R.projectiles.splice(k,1); }
  }
  if (!R.door.active && R.doorEvents.length && R.t>=R.doorEvents[0].at){
    var ev=R.doorEvents.shift();
    R.door={active:true,who:ev.who,start:R.t,end:R.t+cfg.doorMs,hit:false};
    Sfx.door();
  }
  if (R.door.active){
    if (!R.door.hit && R.t>=R.door.end) R.door={active:false};
    else if (R.door.hit && R.t>=R.door.closeAt) R.door={active:false};
  }
  R.pops=R.pops.filter(function(p){return R.t-p.t0<900;});
  R.bursts=R.bursts.filter(function(b){return R.t-b.t0<b.dur;});
  R.parts=R.parts.filter(function(p){return R.t-p.t0<p.life;});
}

function toCanvas(e){ var r=canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*CW/r.width, y:(e.clientY-r.top)*CH/r.height }; }
function nearestDesk(x,y){
  var best=-1, bd=1e9;
  for (var i=0;i<R.desks.length;i++){ var d=R.desks[i], g=geom(d), dx=x-d.x, dy=(y-g.midY)*1.15, dist=dx*dx+dy*dy; if (dist<bd){bd=dist;best=i;} }
  return best;
}
// "click what you see": a troublemaker's icon/bubble first, then the visible student, then the closest desk
function pickDesk(x,y){
  var i, r;
  for (r=3;r>=0;r--) for (i=0;i<R.desks.length;i++){ var d=R.desks[i];
    if (d.row===r && d.state==='mis' && d.stackRect && x>=d.stackRect.x0 && x<=d.stackRect.x1 && y>=d.stackRect.y0 && y<=d.stackRect.y1) return i; }
  for (r=3;r>=0;r--) for (i=0;i<R.desks.length;i++){ var e=R.desks[i], g=geom(e);
    if (e.row===r && Math.abs(x-e.x)<=10*e.c && y>=g.top && y<=e.b) return i; }
  return nearestDesk(x,y);
}
function onDown(x,y){
  if (state!=='playing' || !R || R.countdown>0) return;
  if (doorHitAt(x,y)){ resolveDoorHit(); return; }
  if (y<40) return;
  startCharge(pickDesk(x,y));
}

function frame(ts){
  if (!lastTs) lastTs=ts;
  var dt=Math.min(50,ts-lastTs); lastTs=ts; nowMs+=dt;
  if (state==='playing'){ update(dt); }
  if (R && state==='playing'){ drawClassroom(nowMs,null); }
  else if (R && (state==='levelComplete'||state==='win'||state==='gameOver')){
    var mode=(state==='gameOver')?'laugh':'cry';
    for (var i=0;i<R.desks.length;i++){ var d=R.desks[i];
      if (!d.hitLineR) d.hitLineR=pick(HIT_LINES[d.occ.id]||HIT_LINES.any);
      if (!d.laughLine) d.laughLine=LAUGH_LINES[i%LAUGH_LINES.length]; }
    drawClassroom(nowMs,mode);
  } else drawTitle(nowMs);
  updateWeaponBar();
  syncOverlay();
  requestAnimationFrame(frame);
}

function init(){
  canvas=document.getElementById('game'); ctx=canvas.getContext('2d');
  ov=document.getElementById('overlay'); panelTitle=document.getElementById('overlayTitle'); panelText=document.getElementById('overlayText');
  panelHS=document.getElementById('highScoreLine'); panelBtns=document.getElementById('modeBtns'); stageEl=document.getElementById('stage');
  highScore=Store.get('cd_best_any',0);
  buildBackground(); buildWeaponBar();
  canvas.addEventListener('pointerdown',function(e){ Sfx.init(); var p=toCanvas(e); hoverIdx=-1; onDown(p.x,p.y); e.preventDefault(); });
  canvas.addEventListener('pointermove',function(e){ if (state==='playing' && R && e.pointerType==='mouse'){ var p=toCanvas(e); hoverIdx = (p.y>40 && !doorHitAt(p.x,p.y)) ? pickDesk(p.x,p.y) : -1; } });
  canvas.addEventListener('pointerleave',function(){ hoverIdx=-1; });
  window.addEventListener('pointerup',function(){ releaseCharge(); });
  window.addEventListener('pointercancel',function(){ if (R) R.charge.on=false; });
  var sb=document.getElementById('sfxBtn');
  function toggleSfx(){ Sfx.setOn(!Sfx.isOn()); sb.textContent='SFX: '+(Sfx.isOn()?'ON':'OFF'); }
  window.addEventListener('keydown',function(e){
    if (e.key==='1') setWeapon('chalk'); else if (e.key==='2') setWeapon('paper'); else if (e.key==='3') setWeapon('eraser');
    else if (e.key==='m'||e.key==='M') toggleSfx();
  });
  sb.addEventListener('click',function(){ Sfx.init(); toggleSfx(); });
  showMenu();
  requestAnimationFrame(frame);
}
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

window.__CD__ = {
  getState:function(){return state;}, setState:function(s){state=s;},
  startGame:startGame, getR:function(){return R;}, update:update, endRound:endRound,
  skipCountdown:function(){ if (R) R.countdown=0; },
  throwAt:throwAt, resolveHit:resolveHit, resolveDoorHit:resolveDoorHit, doorHitAt:doorHitAt, spawnMis:spawnMis, curCfg:curCfg,
  setWeapon:setWeapon, nearestDesk:nearestDesk, pickDesk:pickDesk, startCharge:startCharge, releaseCharge:releaseCharge, onDown:onDown,
  comboMult:comboMult, LEVELS:LEVELS, VISITORS:VISITORS, DOOR_RECT:DOOR_RECT, geom:geom,
  smithFrameName:smithFrameName, smithHand:smithHand, setFrozen:function(v){frozen=!!v;}, getHigh:function(){return highScore;}, setRand:function(f){rand=f;}, getNow:function(){return nowMs;}
};
})();
</script>
