<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #8B7355 70%, #8B7355 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #gameContainer {
    position: relative;
  }
  canvas {
    border: 4px solid #333;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    background: transparent;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .healthbar-container {
    width: 260px;
  }
  .name {
    color: white;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 1px 1px 2px black;
    margin-bottom: 4px;
  }
  .healthbar-bg {
    width: 100%;
    height: 20px;
    background: #333;
    border: 2px solid black;
    border-radius: 4px;
    overflow: hidden;
  }
  .healthbar-fill {
    height: 100%;
    transition: width 0.2s ease;
  }
  #p1health { background: linear-gradient(to right, #ff4d4d, #ff8080); }
  #p2health { background: linear-gradient(to right, #4d94ff, #80b3ff); }
  #timer {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 1px 1px 2px black;
  }
  #message {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
    display: none;
    text-align: center;
  }
  #restartHint {
    font-size: 16px;
    margin-top: 10px;
    display: block;
  }
  #controls {
    text-align: center;
    color: #333;
    font-size: 13px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="ui">
    <div class="healthbar-container">
      <div class="name">Player 1 (Red)</div>
      <div class="healthbar-bg"><div class="healthbar-fill" id="p1health" style="width:100%"></div></div>
    </div>
    <div class="healthbar-container">
      <div class="name" style="text-align:right">Player 2 (Blue)</div>
      <div class="healthbar-bg"><div class="healthbar-fill" id="p2health" style="width:100%"></div></div>
    </div>
  </div>
  <div id="timer">60</div>
  <div id="message"><span id="messageText"></span><span id="restartHint">Press R to play again</span></div>
  <canvas id="game" width="800" height="400"></canvas>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GROUND_Y = 340;
const GRAVITY = 0.9;

function makeFighter(x, color, facing) {
  return {
    x, y: GROUND_Y, vx: 0, vy: 0,
    width: 40, height: 90,
    color, facing,
    health: 100,
    isAttacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    hitThisAttack: false,
    isBlocking: false,
    isJumping: false,
    hitFlash: 0,
    knockback: 0
  };
}

let p1 = makeFighter(150, '#e63946', 1);
let p2 = makeFighter(610, '#3a86ff', -1);

let keys = {};
let timeLeft = 60;
let gameOver = false;
let lastTime = performance.now();
let timerAccum = 0;

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (gameOver && e.key.toLowerCase() === 'r') restartGame();
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function restartGame() {
  p1 = makeFighter(150, '#e63946', 1);
  p2 = makeFighter(610, '#3a86ff', -1);
  timeLeft = 60;
  gameOver = false;
  document.getElementById('message').style.display = 'none';
  updateHealthBars();
  document.getElementById('timer').textContent = timeLeft;
}

function updateHealthBars() {
  document.getElementById('p1health').style.width = Math.max(0, p1.health) + '%';
  document.getElementById('p2health').style.width = Math.max(0, p2.health) + '%';
}

function rectsOverlap(a, ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function handleInput(f, isP1) {
  if (gameOver) return;
  const speed = 4;
  const left = isP1 ? 'a' : 'arrowleft';
  const right = isP1 ? 'd' : 'arrowright';
  const jump = isP1 ? 'w' : 'arrowup';
  const punch = isP1 ? 'f' : 'k';
  const block = isP1 ? 'g' : 'l';

  f.isBlocking = !!keys[block] && !f.isJumping;

  if (!f.isBlocking) {
    if (keys[left]) { f.vx = -speed; f.facing = -1; }
    else if (keys[right]) { f.vx = speed; f.facing = 1; }
    else { f.vx *= 0.7; }
  } else {
    f.vx = 0;
  }

  if (keys[jump] && !f.isJumping) {
    f.vy = -14;
    f.isJumping = true;
  }

  if (keys[punch] && f.attackCooldown <= 0 && !f.isBlocking) {
    f.isAttacking = true;
    f.attackTimer = 14;
    f.attackCooldown = 26;
    f.hitThisAttack = false;
  }
}

function update() {
  if (gameOver) return;

  handleInput(p1, true);
  handleInput(p2, false);

  [p1, p2].forEach(f => {
    f.x += f.vx;
    f.vy += GRAVITY;
    f.y += f.vy;
    if (f.y > GROUND_Y) { f.y = GROUND_Y; f.vy = 0; f.isJumping = false; }
    f.x = Math.max(20, Math.min(canvas.width - f.width - 20, f.x));

    if (f.attackCooldown > 0) f.attackCooldown--;
    if (f.isAttacking) {
      f.attackTimer--;
      if (f.attackTimer <= 0) f.isAttacking = false;
    }
    if (f.hitFlash > 0) f.hitFlash--;
  });

  // face each other
  p1.facing = p1.x < p2.x ? 1 : -1;
  p2.facing = p2.x < p1.x ? 1 : -1;

  // attack collision
  [[p1, p2], [p2, p1]].forEach(([attacker, defender]) => {
    if (attacker.isAttacking && !attacker.hitThisAttack && attacker.attackTimer < 10 && attacker.attackTimer > 4) {
      const reach = 34;
      const ax = attacker.facing === 1 ? attacker.x + attacker.width : attacker.x - reach;
      if (rectsOverlap(null, ax, attacker.y - attacker.height, reach, attacker.height,
                        defender.x, defender.y - defender.height, defender.width, defender.height)) {
        attacker.hitThisAttack = true;
        let dmg = defender.isBlocking ? 2 : 8;
        defender.health -= dmg;
        defender.hitFlash = 8;
        defender.vx += attacker.facing * (defender.isBlocking ? 2 : 6);
        updateHealthBars();
        if (defender.health <= 0) {
          defender.health = 0;
          updateHealthBars();
          endGame(attacker === p1 ? 'Player 1 Wins!' : 'Player 2 Wins!');
        }
      }
    }
  });
}

function endGame(text) {
  gameOver = true;
  document.getElementById('messageText').textContent = text;
  document.getElementById('message').style.display = 'block';
}

function drawFighter(f) {
  ctx.save();
  if (f.hitFlash > 0 && f.hitFlash % 4 < 2) {
    ctx.globalAlpha = 0.5;
  }

  const baseX = f.x;
  const baseY = f.y;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(baseX + f.width/2, GROUND_Y + 6, 26, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // legs
  ctx.strokeStyle = f.color;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  const legOffset = f.vx !== 0 && !f.isJumping ? Math.sin(performance.now()/80) * 8 : 0;
  ctx.beginPath();
  ctx.moveTo(baseX + f.width/2 - 6, baseY - 40);
  ctx.lineTo(baseX + f.width/2 - 10 + legOffset, baseY);
  ctx.moveTo(baseX + f.width/2 + 6, baseY - 40);
  ctx.lineTo(baseX + f.width/2 + 10 - legOffset, baseY);
  ctx.stroke();

  // body
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.roundRect(baseX + 4, baseY - f.height, f.width - 8, 50, 8);
  ctx.fill();

  // head
  ctx.fillStyle = '#ffd8a8';
  ctx.beginPath();
  ctx.arc(baseX + f.width/2, baseY - f.height - 12, 14, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // arms
  ctx.strokeStyle = f.color;
  ctx.lineWidth = 8;
  const armY = baseY - f.height + 15;
  const backArmX = baseX + f.width/2 - f.facing * 8;
  ctx.beginPath();
  ctx.moveTo(backArmX, armY);
  ctx.lineTo(backArmX - f.facing * 4, armY + 20);
  ctx.stroke();

  let frontArmEndX, frontArmEndY;
  if (f.isAttacking && f.attackTimer < 10) {
    const punchExtend = f.facing * 34;
    frontArmEndX = baseX + f.width/2 + punchExtend;
    frontArmEndY = armY;
  } else if (f.isBlocking) {
    frontArmEndX = baseX + f.width/2 + f.facing * 14;
    frontArmEndY = armY - 6;
  } else {
    frontArmEndX = baseX + f.width/2 + f.facing * 10;
    frontArmEndY = armY + 16;
  }
  ctx.beginPath();
  ctx.moveTo(baseX + f.width/2 + f.facing * 8, armY);
  ctx.lineTo(frontArmEndX, frontArmEndY);
  ctx.stroke();

  // fist
  ctx.fillStyle = '#ffd8a8';
  ctx.beginPath();
  ctx.arc(frontArmEndX, frontArmEndY, 6, 0, Math.PI*2);
  ctx.fill();

  // block shield indicator
  if (f.isBlocking) {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(baseX + f.width/2 + f.facing*20, baseY - f.height + 25, 16, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ground line
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 4);
  ctx.lineTo(canvas.width, GROUND_Y + 4);
  ctx.stroke();

  drawFighter(p1);
  drawFighter(p2);
}

function loop(now) {
  const dt = now - lastTime;
  lastTime = now;

  if (!gameOver) {
    timerAccum += dt;
    if (timerAccum >= 1000) {
      timerAccum -= 1000;
      timeLeft--;
      document.getElementById('timer').textContent = timeLeft;
      if (timeLeft <= 0) {
        timeLeft = 0;
        if (p1.health > p2.health) endGame('Player 1 Wins!');
        else if (p2.health > p1.health) endGame('Player 2 Wins!');
        else endGame("It's a Draw!");
      }
    }
  }

  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
<div id="controls">
  <b>Player 1 (Red):</b> A/D move · W jump · F punch · G block &nbsp;&nbsp;|&nbsp;&nbsp;
  <b>Player 2 (Blue):</b> ←/→ move · ↑ jump · K punch · L block
</div>
</body>
</html>
